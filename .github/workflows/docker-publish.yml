# Builds this service's Docker image and pushes it to Docker Hub as alha0086/virtual-customer:lab8.
# Needs the repository secret DOCKERHUB_TOKEN (a Docker Hub access token with Read & Write).
name: Build and push Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: alha0086
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push alha0086/virtual-customer:lab8
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            alha0086/virtual-customer:lab8
            alha0086/virtual-customer:${{ github.sha }}
